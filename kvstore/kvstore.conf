# 持久化开关
ENABLE_FULL_PERSIST=1
ENABLE_INCREMENTAL_PERSIST=0

# 日志文件路径
LOG_PATH="./log/full_log.txt"
LOG_PATH_ICR="./log/icr_log.txt"

# 日志与指令限制
MAX_RECOVER_CMD=10000
LINE_MAX=1048576        # 1024*1024
MAX_CMD_NUM=10000
CMD_DELIM=";"

# mmap 内存配置
DEFAULT_CAPACITY=8192   # 4096*2
MMAP_GROW_FACTOR=2

# reactor 缓冲区
BUFFER_LENGTH=10240   # 1024*10

# 存储引擎开关/不建议修改
ENABLE_RBTREE=1
ENABLE_ARRAY=1
ENABLE_HASH=1
ENABLE_SKIPLIST=1

# 内存池开关/不建议修改
ENABLE_SLAB_POOL=1

# 服务端口
PORT=2000