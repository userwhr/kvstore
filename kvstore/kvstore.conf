# 持久化开关
ENABLE_FULL_PERSIST=1
ENABLE_INCREMENTAL_PERSIST=0

# 日志文件路径
LOG_PATH="./log/full_log.txt"
LOG_PATH_ICR="./log/icr_log.txt"

# 日志与指令限制
MAX_RECOVER_CMD=10000
LINE_MAX=1048576        # 1024*1024
MAX_CMD_NUM=10000
CMD_DELIM=";"

# mmap 内存配置
DEFAULT_CAPACITY=8192   # 4096*2
MMAP_GROW_FACTOR=2

# reactor 缓冲区
BUFFER_LENGTH=10240   # 1024*10

# 存储引擎开关/不建议修改
ENABLE_RBTREE=1
ENABLE_ARRAY=1
ENABLE_HASH=1
ENABLE_SKIPLIST=1

# 内存池开关
ENABLE_SLAB_POOL=0


ENABLE_SLAVE=0

# Slave 配置（仅在 ENABLE_SLAVE=1 时生效）
# 注意：必须使用 ens33 网卡的 IP，不能使用 127.0.0.1（RDMA 无法路由 loopback）
SLAVE_OF_IP="192.168.140.134"
# Slave 通过 TCP 连接 Master 的这个端口，发送 SYNC 命令。
SLAVE_OF_PORT=2000 
#  Master 通过 RDMA 在这个端口上监听，等待 Slave 连接来传输全量数据文件。
SLAVE_RDMA_PORT=4000 

# 服务端口
PORT=2000

# RDMA 绑定网卡配置
# chmod +x scripts/setup_rdma.sh
# 启动前需要将 ens33 绑定到 rxe0：
#   sudo rdma link add rxe0 type rxe netdev ens33
# 或运行脚本:
#   sudo ./scripts/setup_rdma.sh
